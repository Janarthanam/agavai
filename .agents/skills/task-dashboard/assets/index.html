<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks</title>
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Project navigation">
        <div class="workspace-row"><span class="project-avatar" id="project-initial">P</span><span class="project-name" id="project-name">Project</span><span class="workspace-chevron">⌄</span></div>
        <div class="sidebar-group-label">Workspace</div>
        <button class="nav-item active" id="all-files" type="button"><span class="nav-icon">◫</span><span>All tasks</span><span class="nav-count" id="all-count">0</span></button>
        <div class="sidebar-group-label files-label">Task files</div>
        <nav id="file-list" aria-label="Task files"></nav>
        <div class="sidebar-footer"><span class="live-dot"></span> Reading <code>tasks/</code></div>
      </aside>

      <main class="main">
        <header class="topbar"><div class="breadcrumb"><span id="breadcrumb-project">Project</span><span class="slash">›</span><strong id="breadcrumb-view">All tasks</strong></div><div class="sync" id="sync">Connecting…</div></header>
        <div class="view-header"><div class="view-name"><span class="view-icon">◫</span><h1 id="page-title">All tasks</h1><span class="view-count" id="visible-count">0</span></div><div class="view-actions"><button id="archive-file" class="archive-action" type="button" hidden>Move to archive</button><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search tasks" aria-label="Search tasks"></label><div class="layout-switch" role="group" aria-label="Task layout"><button id="list-layout" type="button" aria-label="List view" aria-pressed="true" title="List view">☰</button><button id="board-layout" type="button" aria-label="Board view" aria-pressed="false" title="Board view">▦</button></div></div></div>
        <div class="filterbar"><span class="filter-label">Status</span><div class="filters" id="filters" aria-label="Filter by status"></div><span class="filter-label">Priority</span><div class="filters" id="priority-filters" aria-label="Filter by priority"></div><span class="filter-label">Tag</span><div class="filters" id="tag-filters" aria-label="Filter by tag"></div></div>
        <div id="task-list" class="task-list list-view" aria-live="polite"></div>
      </main>

      <aside class="detail-panel" id="detail-panel" aria-label="Task details" hidden>
        <div class="detail-top"><span id="detail-id"></span><button id="close-detail" type="button" aria-label="Close task details">×</button></div>
        <div class="detail-body"><div class="detail-kicker">Task</div><h2 id="detail-title"></h2><div class="detail-field"><span>Status</span><strong id="detail-status"></strong></div><div class="detail-field"><span>Priority</span><strong id="detail-priority"></strong></div><div class="detail-field"><span>Tag</span><strong id="detail-tag"></strong></div><div class="detail-field"><span>Section</span><strong id="detail-section"></strong></div><div class="detail-field"><span>Source</span><strong id="detail-source"></strong></div></div>
      </aside>
    </div>
  </body>
</html>
