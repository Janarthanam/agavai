# --- Conversation -------------------------------------------------------------

[[case]]
id = "conversation.wallpaper.pick"
section = "conversation"
[[case.turns]]
say = "show me my wallpapers"
kind = "answer"
shown = ["neon city"]
[[case.turns]]
say = "neon city"
kind = "act"
context = "follow_up"
checks = [{ path = "wallpaper.current", eq = "neon city" }]

[[case]]
id = "conversation.reminder.answer"
section = "conversation"
[[case.turns]]
say = "set a reminder"
kind = "ask"
[[case.turns]]
say = "in ten minutes to check the oven"
kind = "act"
context = "follow_up"
checks = [{ path = "reminders", added = 1, match = { due = "2026-10-09T16:55", text = "~oven" } }]

[[case]]
id = "conversation.volume.more"
section = "conversation"
[[case.turns]]
say = "turn the volume up"
kind = "act"
checks = [{ path = "audio.volume", gt = 50 }]
[[case.turns]]
say = "a bit more"
kind = "act"
context = "follow_up"
checks = [{ path = "audio.volume", gt = 55 }]

[[case]]
id = "conversation.theme.choose"
section = "conversation"
[[case.turns]]
say = "what themes do i have"
kind = "answer"
shown = ["Nord"]
[[case.turns]]
say = "use the nord one"
kind = "act"
context = "follow_up"
checks = [{ path = "theme.current", eq = "Nord" }]

[[case]]
id = "conversation.brightness.correct"
section = "conversation"
[[case.turns]]
say = "set brightness to forty percent"
kind = "act"
checks = [{ path = "display.brightness", eq = 40 }]
[[case.turns]]
say = "no make it fifty"
kind = "act"
context = "follow_up"
checks = [{ path = "display.brightness", eq = 50 }]

[[case]]
id = "conversation.topic.time"
section = "conversation"
[[case.turns]]
say = "show me my wallpapers"
kind = "answer"
shown = ["ship at sea"]
[[case.turns]]
say = "what time is it"
kind = "answer"
context = "new_conversation"
reply_any = ['4:45', '16:45', 'four forty[- ]?five', 'quarter to five']

[[case]]
id = "conversation.launch.and"
section = "conversation"
[[case.turns]]
say = "open the browser"
kind = "act"
checks = [{ path = "launched", added = 1, one_of = ["browser", "firefox"] }]
[[case.turns]]
say = "and now the terminal"
kind = "act"
context = "follow_up"
checks = [{ path = "launched", added = 1, one_of = ["terminal"] }]

[[case]]
id = "conversation.status.and"
section = "conversation"
[[case.turns]]
say = "what is my battery level"
kind = "answer"
number = 43
[[case.turns]]
say = "and the wifi"
kind = "answer"
context = "follow_up"
reply_any = ['home ?net']

[[case]]
id = "conversation.files.other"
section = "conversation"
[[case.turns]]
say = "find the budget notes"
kind = "answer"
shown = ["Budget Notes"]
[[case.turns]]
say = "what about the meeting notes"
kind = "answer"
context = "follow_up"
shown = ["Meeting Notes"]

[[case]]
id = "conversation.reminder.change"
section = "conversation"
[[case.turns]]
say = "remind me in ten minutes to stretch"
kind = "act"
checks = [{ path = "reminders", added = 1, match = { due = "2026-10-09T16:55", text = "~stretch" } }]
[[case.turns]]
say = "actually make that twenty"
kind = "act"
context = "follow_up"
checks = [
  { path = "reminders", added = 1, match = { due = "2026-10-09T17:05", text = "~stretch" } },
  { path = "reminders", lacks = { due = "2026-10-09T16:55" } },
]

[[case]]
id = "conversation.window.too"
section = "conversation"
[[case.turns]]
say = "close the downloads window"
kind = "act"
checks = [{ path = "windows", removed = 1, match = { address = "0x4" } }]
allow = ["focus"]
[[case.turns]]
say = "and the signal one too"
kind = "act"
context = "follow_up"
checks = [{ path = "windows", removed = 1, match = { address = "0x3" } }]
allow = ["focus"]

[[case]]
id = "conversation.wallpaper.change"
section = "conversation"
[[case.turns]]
say = "what is my wallpaper"
kind = "answer"
reply_any = ['mountain dawn']
[[case.turns]]
say = "change it to ship at sea"
kind = "act"
context = "follow_up"
checks = [{ path = "wallpaper.current", eq = "ship at sea" }]

