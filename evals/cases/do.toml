# --- Multi-step ----------------------------------------------------------------------------

[[case]]
id = "multi.dim-dnd"
section = "multi_step"
say = "make the screen dimmer and turn on do not disturb"
kind = "act"
checks = [{ path = "display.brightness", lt = 60 }, { path = "system.dnd", eq = true }]

[[case]]
id = "multi.mic-spotify"
section = "multi_step"
say = "mute the mic and open spotify"
kind = "act"
checks = [{ path = "audio.mic_muted", eq = true }, { path = "launched", added = 1, one_of = ["spotify"] }]

[[case]]
id = "multi.theme-wallpaper"
section = "multi_step"
say = "set the theme to nord and the wallpaper to neon city"
kind = "act"
checks = [{ path = "theme.current", eq = "Nord" }, { path = "wallpaper.current", eq = "neon city" }]

[[case]]
id = "multi.nightlight.already-on"
section = "multi_step"
set = { "display.nightlight" = true }
say = "turn on the night light"
kind = "act"
checks = [{ path = "display.nightlight", eq = true }]

[[case]]
id = "multi.bluetooth.if-on"
section = "multi_step"
set = { "bluetooth.power" = true }
say = "turn off bluetooth if it is on"
kind = "act"
checks = [{ path = "bluetooth.power", eq = false }]

[[case]]
id = "multi.battery.low"
section = "multi_step"
say = "if my battery is below fifty percent turn the brightness down"
kind = "act"
checks = [{ path = "display.brightness", lt = 60 }]

[[case]]
id = "multi.battery.high"
section = "multi_step"
set = { "battery.percent" = 80 }
say = "if my battery is below fifty percent turn the brightness down"
kind = "act"
checks = [{ path = "display.brightness", eq = 60 }]

[[case]]
id = "multi.workspace-fullscreen"
section = "multi_step"
say = "go to workspace two and make the signal window full screen"
kind = "act"
checks = [{ path = "workspace.active", eq = 2 }, { path = "fullscreen.window", eq = "0x3" }]
allow = ["focus"]

[[case]]
id = "multi.screenshot-notify"
section = "multi_step"
say = "take a screenshot and send me a notification when it is done"
kind = "act"
checks = [{ path = "screenshots", added = 1 }, { path = "notifications", added = 1 }]

[[case]]
id = "multi.invoice-calendar"
section = "multi_step"
needs = ["mail", "calendar"]
say = "find the acme invoice email and put the due date on my calendar"
kind = "act"
checks = [{ path = "calendar.events", added = 1, match = { start = "~2026-10-20" } }]

[[case]]
id = "multi.free-lunch"
section = "multi_step"
needs = ["calendar"]
now = "2026-10-09T09:30"
say = "check if i am free at noon on monday and if so book lunch"
kind = "act"
checks = [{ path = "calendar.events", added = 1, match = { start = "2026-10-12T12:00", title = "~lunch" } }]

[[case]]
id = "multi.remind-before-meeting"
section = "multi_step"
needs = ["calendar"]
now = "2026-10-09T09:30"
say = "remind me ten minutes before my next meeting"
kind = "act"
checks = [{ path = "reminders", added = 1, match = { due = "2026-10-09T14:50" } }]
