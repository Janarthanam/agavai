checks = [{ path = "files.paths", has = "documents/invoice-acme-0921.pdf" }, { path = "files.paths", lacks = "downloads/invoice-acme" }]

[[case]]
id = "files.rename.meeting"
section = "files"
needs = ["files"]
say = "rename the meeting notes to september meeting"
