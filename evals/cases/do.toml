# --- Mail -------------------------------------------------------------------------

[[case]]
id = "mail.unread.count"
section = "mail"
needs = ["mail"]
say = "how many unread emails do i have"
kind = "answer"
number = 2

[[case]]
id = "mail.unread.bank"
section = "mail"
needs = ["mail"]
say = "do i have any email from the bank"
kind = "answer"
reply_any = ['statement']

[[case]]
id = "mail.read.sara"
section = "mail"
needs = ["mail", "contacts"]
say = "read me the latest email from sara"
kind = "answer"
reply_any = ['dinner']

[[case]]
id = "mail.summarize.unread"
section = "mail"
needs = ["mail"]
say = "summarize my unread email"
kind = "answer"
reply_all = ['statement|bank', 'dinner|sara']

[[case]]
id = "mail.draft.dana"
section = "mail"
needs = ["mail", "contacts"]
say = "draft a reply to dana saying i will review the budget on monday"
kind = "act"
checks = [{ path = "mail.drafts", added = 1 }, { path = "mail.drafts", has = "monday" }]

[[case]]
id = "mail.send.bob"
section = "mail"
needs = ["mail", "contacts"]
[[case.turns]]
say = "email bob that i am running ten minutes late"
kind = "ask"
claims = "email|sent|mail"
[[case.turns]]
say = "yes send it"
kind = "act"
context = "follow_up"
checks = [{ path = "mail.outbox", added = 1 }, { path = "mail.outbox", has = "bob.lee@example.com" }, { path = "mail.outbox", has = "late" }]

[[case]]
id = "mail.reply.sara"
section = "mail"
needs = ["mail", "contacts"]
[[case.turns]]
say = "reply to sara and say yes saturday works"
kind = "ask"
claims = "repl|sent|mail"
[[case.turns]]
say = "yes"
kind = "act"
context = "follow_up"
checks = [{ path = "mail.outbox", added = 1 }, { path = "mail.outbox", has = "sara.kim@example.com" }, { path = "mail.outbox", has = "saturday" }]

[[case]]
id = "mail.forward.bank"
section = "mail"
needs = ["mail", "contacts"]
[[case.turns]]
say = "forward the bank email to priya"
kind = "ask"
claims = "forward|sent"
[[case.turns]]
say = "go ahead"
kind = "act"
context = "follow_up"
checks = [{ path = "mail.outbox", added = 1 }, { path = "mail.outbox", has = "priya@example.com" }, { path = "mail.outbox", has = "statement" }]

[[case]]
id = "mail.mark.read"
section = "mail"
needs = ["mail"]
say = "mark all my email as read"
kind = "act"
checks = [{ path = "mail.inbox", lacks = { unread = true } }]

