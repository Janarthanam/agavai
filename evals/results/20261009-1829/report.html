};

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }

}

  box.append(el("div", { class: "card" }, el("h3", { text: "Reply rules" }),
    el("p", { class: "note", text: "Every final reply against the rules in Agavai's system prompt. Proposed rules are reported, not counted." }),
    el("table", {}, el("tbody", {}, rules.map(r => el("tr", {}, el("td", {}, r.label, r.counted ? null : el("span", { class: "chip", text: "proposed" })),
      el("td", { class: "num", text: r.total ? `${fmt(100 * r.passed / r.total, 0)}%` : "–" }), el("td", { class: "num note", text: `${r.passed}/${r.total}` })))))));
  box.append(el("div", { class: "card" }, el("h3", { text: "Capabilities not built yet" }),
    el("p", { class: "note", text: "Cases that need these still run: a refusal is an honest miss, a false claim is a harmful one." }),
    el("table", {}, el("tbody", {}, data.capabilities.map(c => el("tr", {}, el("td", { class: "mono", text: c.id }), el("td", { class: "num", text: `${c.cases} cases` }), el("td", { text: c.built ? "built" : "not built" })))))));
  return box;
}

function runView(data) {
  const fp = data.run.fingerprint || {};
  const rows = Object.entries(fp).map(([k, v]) => el("tr", {}, el("td", { text: k }), el("td", { class: "mono", text: typeof v === "string" ? v : JSON.stringify(v) })));
  const canary = data.run.canary || {};
  return el("div", { class: "card table-wrap" },
    el("p", {}, statusBadge(canary.ok ? "done" : "harmful"), " ", el("span", { class: "note", text: canary.ok ? "Canary: three cases repeated exactly, so sampling was pinned." : `Canary failed: ${(canary.problems || []).join("; ")}` })),
    el("p", { class: "note", text: `Stages: ${Object.entries(data.run.stages).map(([k, v]) => `${k} ${v ? "ran" : "missing"}`).join(", ")}. Report generated ${data.generated}.` }),
    el("table", {}, el("tbody", {}, rows)));
}

let current = null;
const state = { shippedOnly: false, area: "", section: "", outcome: "", query: "" };
function rerender() { if (current) render(current); }
function render(data) {
  current = data;
  const app = document.getElementById("app");
  const scrollY = window.scrollY;
  app.replaceChildren(
    header(data), kpis(data),
    el("h2", { text: "Areas" }), areaChart(data),
    el("h2", { text: "Sections" }), sectionsView(data, state),
    el("h2", { text: "Harmful misses" }), el("p", { class: "lede", text: "Listed by name so an average cannot bury them." }), harmfulView(data),
    el("h2", { text: "Where to look first" }), weakest(data),
    el("h2", { text: "Practical" }), practicalView(data),
    el("h2", { text: "Voice" }), voiceView(data),
    el("h2", { text: "Diagnostics and reply rules" }), diagnosticsView(data),
    el("h2", { id: "cases", text: "Every case" }), el("p", { class: "lede", text: "Select a row to see what was said, what Agavai replied, how the world changed, and why it was graded so." }), caseExplorer(data, state),
    el("h2", { text: "Run" }), runView(data));
  bindOpeners();
  window.scrollTo(0, scrollY);
}

function bindOpeners() {
  document.querySelectorAll("input[data-open]").forEach(input => input.addEventListener("change", async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try { render(JSON.parse(await file.text())); } catch (error) { alert(`Could not read ${file.name}: ${error.message}`); }
  }));
}
function cycleTheme() {
  const root = document.documentElement;
  const next = root.dataset.theme === "dark" ? "light" : root.dataset.theme === "light" ? "" : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  if (next) root.dataset.theme = next; else delete root.dataset.theme;
}
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", async e => {
  e.preventDefault();
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) { try { render(JSON.parse(await file.text())); } catch (error) { alert(`Could not read ${file.name}: ${error.message}`); } }
});

const raw = document.getElementById("report-data").textContent.trim();
if (raw && raw !== "__REPORT_DATA__") render(JSON.parse(raw));
else { document.getElementById("empty").hidden = false; bindOpeners(); }
</script>
</body>
</html>
